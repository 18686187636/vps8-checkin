name: VPS8 Checkin

on:
  schedule:
    - cron: "23 1,9,17 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compute Beijing date
        id: bjdate
        run: echo "date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore checkin state
        uses: actions/cache@v4
        with:
          path: .checkin_state
          key: vps8-checkin-state-${{ steps.bjdate.outputs.date }}

      - name: Install Python deps
        run: pip install -r requirements.txt

      # ===== 安装 Chrome for Testing 136（保留 --load-extension） =====
      - name: Install Chrome for Testing 136
        run: |
          CFM_VERSION="136.0.7103.113"
          URL="https://storage.googleapis.com/chrome-for-testing-public/${CFM_VERSION}/linux64/chrome-linux64.zip"

          echo "⬇️ 下载 Chrome for Testing ${CFM_VERSION}"
          mkdir -p /tmp/chrome-for-testing
          cd /tmp/chrome-for-testing

          download_ok=0
          for PREFIX in "" "https://ghfast.top/" "https://ghproxy.net/"; do
            echo "尝试: ${PREFIX}${URL}"
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 300 \
                 -o chrome-linux64.zip "${PREFIX}${URL}"; then
              if file chrome-linux64.zip | grep -q 'Zip archive'; then
                download_ok=1
                break
              fi
              rm -f chrome-linux64.zip
            fi
          done

          if [ "$download_ok" != "1" ]; then
            echo "❌ Chrome for Testing 下载失败"
            exit 1
          fi

          unzip -q chrome-linux64.zip
          rm chrome-linux64.zip
          chmod +x chrome-linux64/chrome
          /tmp/chrome-for-testing/chrome-linux64/chrome --version

          # 安装运行时依赖
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            libxshmfence1 || true

          echo "CHROME_PATH=/tmp/chrome-for-testing/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "✅ Chrome for Testing 准备完成"

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      # ===== 下载并准备 NoneCap 扩展 =====
      - name: Download NoneCap extension
        run: |
          mkdir -p extensions
          cd extensions

          echo "获取 NoneCap 最新 Release 信息..."
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/nonecap/nonecap-extension/releases/latest")

          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          for a in assets:
              name = a['name'].lower()
              if name.endswith('.zip') and 'chrome' in name:
                  print(a['browser_download_url'])
                  sys.exit(0)
          for a in assets:
              if a['name'].endswith('.zip'):
                  print(a['browser_download_url'])
                  sys.exit(0)
          print('')
          ")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ 未能从 GitHub API 获取 NoneCap 下载链接"
            echo "Release 资产列表："
            echo "$RELEASE_JSON" | python3 -m json.tool | head -80
            echo "nonecap_ready=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "下载地址: $DOWNLOAD_URL"

          download_ok=0
          for PREFIX in "" "https://ghfast.top/" "https://ghproxy.net/" "https://gh-proxy.com/"; do
            echo "尝试: ${PREFIX}${DOWNLOAD_URL}"
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 120 \
                 -o nonecap.zip "${PREFIX}${DOWNLOAD_URL}"; then
              if file nonecap.zip | grep -q 'Zip archive'; then
                echo "✅ 下载成功 (${PREFIX:-direct})"
                download_ok=1
                break
              else
                echo "⚠️ 文件不是 zip"
                rm -f nonecap.zip
              fi
            fi
          done

          if [ "$download_ok" != "1" ]; then
            echo "❌ NoneCap 所有下载源均失败"
            echo "nonecap_ready=false" >> "$GITHUB_ENV"
            exit 0
          fi

          unzip -o nonecap.zip -d nonecap
          MANIFEST_DIR=$(dirname "$(find ./nonecap -name "manifest.json" | head -1)")
          if [ -z "$MANIFEST_DIR" ] || [ ! -d "$MANIFEST_DIR" ]; then
            echo "❌ 未找到 manifest.json"
            find ./nonecap -type f | head -20
            echo "nonecap_ready=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "扩展目录: $MANIFEST_DIR"

          if [ -n "${{ secrets.NONE_CAP_KEY }}" ]; then
            cat > "$MANIFEST_DIR/provision.json" <<EOF
          {
            "key": "${{ secrets.NONE_CAP_KEY }}",
            "settings": {
              "style": "fast",
              "showOverlay": false
            }
          }
          EOF
            echo "✅ 已生成 provision.json（含 API Key）"
          else
            if [ -f "$MANIFEST_DIR/provision.example.json" ]; then
              cp "$MANIFEST_DIR/provision.example.json" "$MANIFEST_DIR/provision.json"
              echo "ℹ️ 使用 provision.example.json（免费额度：每天 100 次）"
            else
              echo "ℹ️ 未找到 provision.example.json，使用默认配置"
            fi
          fi

          echo "NONECAP_EXT_PATH=$(realpath "$MANIFEST_DIR")" >> "$GITHUB_ENV"
          echo "nonecap_ready=true" >> "$GITHUB_ENV"
          echo "✅ NoneCap 扩展准备完成"

      - name: Configure sing-box proxy
        id: singbox
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          SING_BOX_VERSION: "1.10.7"
        run: |
          set -e
          if [ -z "$NODE_LINK" ]; then
            echo "proxy_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64)  SB_ARCH="amd64" ;;
            aarch64|arm64) SB_ARCH="arm64" ;;
            *) exit 1 ;;
          esac
          PKG="sing-box-${SING_BOX_VERSION}-linux-${SB_ARCH}"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${PKG}.tar.gz"
          for PREFIX in "" "https://ghfast.top/" "https://ghproxy.net/" "https://gh-proxy.com/"; do
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
                 -o sing-box.tar.gz "${PREFIX}${URL}"; then
              if file sing-box.tar.gz | grep -q 'gzip compressed data'; then break; fi
              rm -f sing-box.tar.gz
            fi
          done
          tar -xzf sing-box.tar.gz
          SING_BOX_DIR=$(find . -maxdepth 1 -type d -name "sing-box-*" | head -1)
          sudo mv "$SING_BOX_DIR/sing-box" /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "$SING_BOX_DIR"

          python3 << 'PYEOF'
          import json, sys, os, re
          from urllib.parse import urlparse, parse_qs
          link = os.environ.get('NODE_LINK', '')
          parsed = urlparse(link)
          netloc = parsed.netloc
          uuid, host_port = netloc.split('@', 1) if '@' in netloc else ('', netloc)
          host, port = '', '443'
          bm = re.match(r'^\[([^\]]+)\](?::(\d+))?$', host_port)
          if bm:
              host = bm.group(1)
              if bm.group(2): port = bm.group(2)
          else:
              if host_port.count(':') > 1: host = host_port
              elif ':' in host_port: host, port = host_port.split(':', 1)
              else: host = host_port
          params = parse_qs(parsed.query)
          sni = params.get('sni', [''])[0] or host
          fp = params.get('fp', [''])[0] or 'chrome'
          flow = params.get('flow', [''])[0] or 'xtls-rprx-vision'
          type_ = params.get('type', ['tcp'])[0]
          security = params.get('security', [''])[0]
          path = params.get('path', [''])[0]
          host_header = params.get('host', [''])[0] or host
          outbound = {"type": "vless", "tag": "vless-out", "server": host,
                      "server_port": int(port), "uuid": uuid, "flow": flow,
                      "packet_encoding": "packetaddr"}
          if security.lower() != 'none':
              outbound["tls"] = {"enabled": True, "server_name": sni, "insecure": False,
                                 "utls": {"enabled": True, "fingerprint": fp}}
          if type_ != 'tcp':
              transport = {"type": type_}
              if type_ == 'ws':
                  transport["path"] = path or "/"
                  transport["headers"] = {"Host": host_header}
              elif type_ == 'grpc':
                  transport["service_name"] = path or ""
              outbound["transport"] = transport
          if security == 'reality':
              outbound['tls']['reality'] = {"enabled": True,
                                            "public_key": params.get('pbk', [''])[0],
                                            "short_id": params.get('sid', [''])[0]}
          config = {"log": {"level": "warn"},
                    "inbounds": [
                        {"type": "socks", "tag": "socks-in", "listen": "127.0.0.1", "listen_port": 1080},
                        {"type": "http", "tag": "http-in", "listen": "127.0.0.1", "listen_port": 1081}],
                    "outbounds": [outbound],
                    "route": {"rules": [{"outbound": "vless-out", "protocol": ["tcp", "udp"]}]}}
          with open("sing-box-config.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF

          nohup sing-box -c sing-box-config.json run > sing-box.log 2>&1 &
          sleep 5
          if ss -tuln 2>/dev/null | grep -q ':1080'; then
            echo "proxy_ready=true" >> "$GITHUB_OUTPUT"
          else
            cat sing-box.log
            echo "proxy_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checkin
        env:
          VPS8_GITHUB_SESSION_B64: ${{ secrets.VPS8_GITHUB_SESSION_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VPS8_PROXY: ${{ steps.singbox.outputs.proxy_ready == 'true' && 'http://127.0.0.1:1081' || '' }}
          NONECAP_EXT_PATH: ${{ env.NONECAP_EXT_PATH }}
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: xvfb-run -a python -m src.checkin

      - name: Show sing-box log on failure
        if: failure()
        run: |
          [ -f sing-box.log ] && tail -50 sing-box.log || true

      - name: Show checkin state
        if: always()
        run: |
          [ -f .checkin_state/last_success.txt ] && cat .checkin_state/last_success.txt || echo "no state"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
