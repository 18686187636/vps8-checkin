name: VPS8 Checkin

on:
  schedule:
    # 每 8 小时一次（北京时间 9:23 / 17:23 / 1:23）
    - cron: "23 1,9,17 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Debug - source check
        run: |
          echo "===== src/ 目录 ====="
          ls -la src/ || echo "src/ 不存在"
          echo ""
          echo "===== checkin.py 调用 create_page / apply_cookies 的地方 ====="
          grep -n "create_page\|apply_cookies" src/checkin.py || echo "无匹配"
          echo ""
          echo "===== browser.py 关键函数签名 ====="
          grep -n "def create_page\|def apply_cookies\|def _inject_cookies" src/browser.py || echo "无匹配"

      - name: Compute Beijing date
        id: bjdate
        run: echo "date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore checkin state
        uses: actions/cache@v4
        id: checkin-state
        with:
          path: .checkin_state
          key: vps8-checkin-state-${{ steps.bjdate.outputs.date }}

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Chrome
        run: |
          python - <<'PY'
          from DrissionPage import ChromiumOptions
          ChromiumOptions().set_browser_path("chrome").save()
          PY
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Debug - cookie probe
        env:
          VPS8_STORAGE_STATE_B64: ${{ secrets.VPS8_STORAGE_STATE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ.get("VPS8_STORAGE_STATE_B64", "")
          print(f"VPS8_STORAGE_STATE_B64 长度: {len(raw)}")
          cookies = json.loads(base64.b64decode(raw).decode())
          if isinstance(cookies, dict):
              cookies = cookies.get("cookies", [])
          php = next((c for c in cookies if c["name"] == "PHPSESSID"), None)
          if not php:
              print("::error::找不到 PHPSESSID")
              raise SystemExit(1)
          open("/tmp/php.txt", "w").write(php["value"])
          print(f"PHPSESSID = {php['value']}")
          PY

          PHP=$(cat /tmp/php.txt)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"

          echo ""
          echo "===== [1] 第一次请求 /dashboard（带 PHPSESSID）====="
          curl -s -i -c /tmp/jar.txt -o /tmp/r1.txt \
            -H "Cookie: PHPSESSID=$PHP" \
            -H "User-Agent: $UA" \
            "https://vps8.zz.cd/dashboard"
          echo "状态行: $(head -1 /tmp/r1.txt)"
          echo "响应 set-cookie:"
          grep -i "^set-cookie" /tmp/r1.txt || echo "  (无)"
          echo "响应前 15 行:"
          head -15 /tmp/r1.txt

          echo ""
          echo "===== [2] 第二次请求 /dashboard（带 jar）====="
          curl -s -i -b /tmp/jar.txt -o /tmp/r2.txt \
            -H "User-Agent: $UA" \
            "https://vps8.zz.cd/dashboard"
          echo "状态行: $(head -1 /tmp/r2.txt)"
          echo "响应前 30 行:"
          head -30 /tmp/r2.txt

          echo ""
          echo "===== [3] 第三次请求 /（首页）====="
          curl -s -i -b /tmp/jar.txt -c /tmp/jar.txt -o /tmp/r3.txt \
            -H "User-Agent: $UA" \
            "https://vps8.zz.cd/"
          echo "状态行: $(head -1 /tmp/r3.txt)"

          echo ""
          echo "===== [4] 再用 jar 请求 /points/signin（签到页）====="
          curl -s -i -b /tmp/jar.txt -o /tmp/r4.txt \
            -H "User-Agent: $UA" \
            "https://vps8.zz.cd/points/signin"
          echo "状态行: $(head -1 /tmp/r4.txt)"
          echo "响应前 20 行:"
          head -20 /tmp/r4.txt

          echo ""
          echo "===== 结论 ====="
          if grep -q "login" /tmp/r4.txt; then
            echo "::warning::即使模拟两次请求，最终仍被引导到 login（cookie 可能真失效）"
          else
            echo "服务端接受该 session（cookie 有效）"
          fi

      - name: Run checkin
        env:
          VPS8_STORAGE_STATE_B64: ${{ secrets.VPS8_STORAGE_STATE_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: xvfb-run -a python -m src.checkin

      - name: Show checkin state
        if: always()
        run: |
          if [ -f .checkin_state/last_success.txt ]; then
            echo "last_success = $(cat .checkin_state/last_success.txt)"
          else
            echo "no state file"
          fi

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
